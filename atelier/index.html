<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier D Yaya</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f8f5f0;
      color: #2f2a26;
    }

    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .content h1 {
      font-size: 48px;
      letter-spacing: 3px;
      margin-bottom: 15px;
    }

    .content p {
      font-size: 18px;
      color: #756c65;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 12px 28px;
      background-color: #2f2a26;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      transition: 0.3s;
    }

    .button:hover {
      background-color: #756c65;
    }
  </style>
</head>

<body>

  <section class="hero">
    <div class="content">
      <h1>Selamat Datang</h1>
      <p>di Atelier D Yaya</p>
      <a href="#" class="button">Jelajahi</a>
    </div>
  </section>

</body>
</html>
